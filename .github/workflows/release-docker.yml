name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build (e.g. v0.9.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    # Skip desktop-only tags (handled by release-desktop.yml)
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'desktop')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tag=${TAG}"
            echo "owner=${OWNER}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "dockerhub=true"
            else
              echo "dockerhub=false"
            fi
            echo "backend_tags<<EOF"
            echo "ghcr.io/${OWNER}/cilikube:${TAG}"
            echo "ghcr.io/${OWNER}/cilikube:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "cilliantech/cilikube:${TAG}"
              echo "cilliantech/cilikube:latest"
            fi
            echo "EOF"
            echo "frontend_tags<<EOF"
            echo "ghcr.io/${OWNER}/cilikube-web:${TAG}"
            echo "ghcr.io/${OWNER}/cilikube-web:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "cilliantech/cilikube-web:${TAG}"
              echo "cilliantech/cilikube-web:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
