# Request definition
[request_definition]
r = sub, obj, act

# Policy definition
[policy_definition]
p = sub, obj, act

# Role definition
[role_definition]
g = _, _

# Policy effect (determines if policy takes effect)
[policy_effect]
e = some(where (p.eft == allow))

# Matching rules
# keyMatch2: each * matches a single path segment (not the rest of the path).
# This prevents /api/v1/namespaces/* from accidentally allowing
# /namespaces/:ns/pods/:name/exec and similar nested routes.
[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
