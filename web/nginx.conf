server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health for compose
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API is terminated on the host reverse proxy (Caddy/Nginx), not here.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
