apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilikube
  namespace: cilikube
  labels:
    app.kubernetes.io/name: cilikube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilikube-manager
  labels:
    app.kubernetes.io/name: cilikube
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilikube-manager
  labels:
    app.kubernetes.io/name: cilikube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilikube-manager
subjects:
  - kind: ServiceAccount
    name: cilikube
    namespace: cilikube
