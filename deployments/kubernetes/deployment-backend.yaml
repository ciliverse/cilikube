apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilikube-backend
  namespace: cilikube
  labels:
    app.kubernetes.io/name: cilikube
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cilikube
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilikube
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: cilikube
      containers:
        - name: backend
          image: cilliantech/cilikube:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/configs/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GIN_MODE
              value: release
            - name: CILIKUBE_CONFIG_PATH
              value: /app/configs/config.yaml
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cilikube-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cilikube-secrets
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: cilikube-config
        - name: data
          persistentVolumeClaim:
            claimName: cilikube-data
