apiVersion: v1
kind: ConfigMap
metadata:
  name: cilikube-config
  namespace: cilikube
  labels:
    app.kubernetes.io/name: cilikube
data:
  config.yaml: |
    server:
      port: "8080"
      read_timeout: 30
      write_timeout: 30
      mode: release
      # Overridden by ENCRYPTION_KEY env from Secret when set.
      encryptionKey: ""
    kubernetes:
      kubeconfig: in-cluster
    database:
      enabled: true
      type: sqlite
      database: /app/data/cilikube.db
    jwt:
      # Overridden by JWT_SECRET env from Secret when set.
      secret_key: ""
      expire_duration: 24h0m0s
      issuer: cilikube
    installer:
      minikubePath: /usr/local/bin/minikube
      minikubeDriver: docker
      downloadDir: /tmp/cilikube_downloads
