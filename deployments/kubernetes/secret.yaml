apiVersion: v1
kind: Secret
metadata:
  name: cilikube-secrets
  namespace: cilikube
  labels:
    app.kubernetes.io/name: cilikube
type: Opaque
# REQUIRED: replace both values before apply. Release mode refuses known defaults.
# JWT_SECRET: >=16 chars, unique. ENCRYPTION_KEY: exactly 32 chars, unique.
stringData:
  JWT_SECRET: REPLACE_WITH_STRONG_JWT_SECRET
  ENCRYPTION_KEY: REPLACE_WITH_32_CHAR_ENC_KEY!!
