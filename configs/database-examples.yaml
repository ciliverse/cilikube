# Database Configuration Examples
# Supports SQLite (local/dev) and PostgreSQL (production)

# ==================== SQLite Configuration ====================
# Lightweight file database, suitable for development and single-replica deploy

database_sqlite:
    enabled: true
    type: "sqlite"
    database: "./data/cilikube.db"  # SQLite database file path
    host: ""
    port: 0
    username: ""
    password: ""
    charset: ""

# ==================== PostgreSQL Configuration ====================
# Recommended for production and multi-replica deployments

database_postgresql:
    enabled: true
    type: "postgresql"              # Or use "postgres"
    host: "localhost"               # PostgreSQL server address
    port: 5432                      # PostgreSQL default port
    username: "postgres"
    password: "your-password"
    database: "cilikube"
    charset: ""

# ==================== Usage ====================
# 1. Copy one block into the database section of config.yaml
# 2. Adjust connection parameters
# 3. Ensure PostgreSQL is running when type is postgresql
# 4. Restart the application

# ==================== Recommendations ====================
# Development / single replica: SQLite
# Production / multi-replica: PostgreSQL
